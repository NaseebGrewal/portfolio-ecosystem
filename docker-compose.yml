# ==============================================================================
# Portfolio Ecosystem - Unified Monorepo Docker Compose
# ==============================================================================
# Starts all 8 applications with a single command:
#
#   docker compose up --build
#
# Services Exposed:
#   - Executive Portfolio Web:           http://localhost:3000
#   - Project 01 (Materials Frontend):   http://localhost:3001
#   - Project 01 (Materials API):        http://localhost:8000/docs
#   - Project 02 (ChemAgent API):        http://localhost:8001/docs
#   - Project 03 (Rheology Engine API):  http://localhost:8002/docs
#   - Project 04 (AI Gateway & FinOps):  http://localhost:8003/docs
#   - Project 05 (Doc Intelligence API): http://localhost:8004/docs
#   - Project 06 (Clinical Triage API):  http://localhost:8005/docs
#   - Project 07 (Code Review AST API):  http://localhost:8006/docs
#   - Shared Redis Cache:                localhost:6379
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Shared In-Memory Redis Cache (Optional for fast caching)
  # ----------------------------------------------------------------------------
  shared_redis:
    image: redis:7.2-alpine
    container_name: shared_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ----------------------------------------------------------------------------
  # Project 01: Materials Intelligence Platform (FastAPI Backend)
  # ----------------------------------------------------------------------------
  materials_backend:
    build:
      context: ./projects/01-materials-intelligence-platform/backend
      dockerfile: Dockerfile
    container_name: materials_backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./projects/01-materials-intelligence-platform/backend:/app

  # ----------------------------------------------------------------------------
  # Project 01: Materials Intelligence Platform (Next.js Frontend)
  # ----------------------------------------------------------------------------
  materials_frontend:
    build:
      context: ./projects/01-materials-intelligence-platform/frontend
      dockerfile: Dockerfile
    container_name: materials_frontend
    restart: unless-stopped
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3001:3000"
    depends_on:
      - materials_backend

  # ----------------------------------------------------------------------------
  # Project 02: ChemAgent SDS & REACH Compliance Auditor (FastAPI Backend)
  # ----------------------------------------------------------------------------
  chemagent_backend:
    build:
      context: ./projects/02-chemagent-sds-compliance/backend
      dockerfile: Dockerfile
    container_name: chemagent_backend
    restart: unless-stopped
    env_file:
      - path: ./portfolio-website/.env.local
        required: false
      - path: ./portfolio-website/.env
        required: false
      - path: ./projects/02-chemagent-sds-compliance/backend/.env
        required: false
    environment:
      - PORT=8001
      - ENVIRONMENT=development
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - NEXT_PUBLIC_GEMINI_AI_API_KEY=${NEXT_PUBLIC_GEMINI_AI_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - ./projects/02-chemagent-sds-compliance/backend:/app

  # ----------------------------------------------------------------------------
  # Project 03: Ultra-Fast Lab Rheology & Mechanics Engine (FastAPI Backend)
  # ----------------------------------------------------------------------------
  rheology_backend:
    build:
      context: ./projects/03-rust-wasm-rheology-engine
      dockerfile: backend/Dockerfile
    container_name: rheology_backend
    restart: unless-stopped
    environment:
      - PORT=8002
      - ENVIRONMENT=development
    ports:
      - "8002:8002"
    volumes:
      - ./projects/03-rust-wasm-rheology-engine/backend:/app

  # ----------------------------------------------------------------------------
  # Project 04: Enterprise AI Gateway & FinOps Controller (FastAPI Backend)
  # ----------------------------------------------------------------------------
  gateway_backend:
    build:
      context: ./projects/04-enterprise-ai-gateway-finops/backend
      dockerfile: Dockerfile
    container_name: gateway_backend
    restart: unless-stopped
    environment:
      - PORT=8003
      - REDIS_URI=redis://shared_redis:6379/0
      - ENVIRONMENT=development
    ports:
      - "8003:8003"
    depends_on:
      - shared_redis
    volumes:
      - ./projects/04-enterprise-ai-gateway-finops/backend:/app

  # ----------------------------------------------------------------------------
  # Project 05: Multimodal Document Intelligence & Semantic Mesh (FastAPI Backend)
  # ----------------------------------------------------------------------------
  doc_intelligence_backend:
    build:
      context: ./projects/05-multimodal-document-intelligence/backend
      dockerfile: Dockerfile
    container_name: doc_intelligence_backend
    restart: unless-stopped
    environment:
      - PORT=8004
      - ENVIRONMENT=development
    ports:
      - "8004:8004"
    volumes:
      - ./projects/05-multimodal-document-intelligence/backend:/app

  # ----------------------------------------------------------------------------
  # Project 06: Clinical NLP Patient Sentiment & Triage (FastAPI Backend)
  # ----------------------------------------------------------------------------
  clinical_triage_backend:
    build:
      context: ./projects/06-clinical-nlp-patient-sentiment-triage/backend
      dockerfile: Dockerfile
    container_name: clinical_triage_backend
    restart: unless-stopped
    environment:
      - PORT=8005
      - ENVIRONMENT=development
    ports:
      - "8005:8005"
    volumes:
      - ./projects/06-clinical-nlp-patient-sentiment-triage/backend:/app

  # ----------------------------------------------------------------------------
  # Project 07: Autonomous AST Code Review & RAG Agent (FastAPI Backend)
  # ----------------------------------------------------------------------------
  code_review_backend:
    build:
      context: ./projects/07-autonomous-ast-code-review-agent/backend
      dockerfile: Dockerfile
    container_name: code_review_backend
    restart: unless-stopped
    environment:
      - PORT=8006
      - ENVIRONMENT=development
    ports:
      - "8006:8006"
    volumes:
      - ./projects/07-autonomous-ast-code-review-agent/backend:/app

  # ----------------------------------------------------------------------------
  # Executive AI Portfolio Website (Next.js 15 Main Application)
  # ----------------------------------------------------------------------------
  portfolio_website:
    build:
      context: ./portfolio-website
      dockerfile: Dockerfile
    container_name: portfolio_website
    restart: unless-stopped
    env_file:
      - path: ./portfolio-website/.env.local
        required: false
      - path: ./portfolio-website/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_MATERIALS_API_URL=http://localhost:8000
      - NEXT_PUBLIC_CHEMAGENT_API_URL=http://localhost:8001
      - NEXT_PUBLIC_RHEOLOGY_API_URL=http://localhost:8002
      - NEXT_PUBLIC_GATEWAY_API_URL=http://localhost:8003
      - NEXT_PUBLIC_DOC_INTELLIGENCE_API_URL=http://localhost:8004
      - NEXT_PUBLIC_CLINICAL_TRIAGE_API_URL=http://localhost:8005
      - NEXT_PUBLIC_CODE_REVIEW_API_URL=http://localhost:8006
      - NEXT_PUBLIC_PROJECT_5_GITHUB_URL=${NEXT_PUBLIC_PROJECT_5_GITHUB_URL:-}
      - NEXT_PUBLIC_PROJECT_6_GITHUB_URL=${NEXT_PUBLIC_PROJECT_6_GITHUB_URL:-}
      - NEXT_PUBLIC_PROJECT_7_GITHUB_URL=${NEXT_PUBLIC_PROJECT_7_GITHUB_URL:-}
      - NEXT_PUBLIC_PROFILE_IMAGE_URL=${NEXT_PUBLIC_PROFILE_IMAGE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - materials_backend
      - chemagent_backend
      - rheology_backend
      - gateway_backend
      - doc_intelligence_backend
      - clinical_triage_backend
      - code_review_backend
