<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .bg-plate { fill: #090d16; }
    .border-stroke { stroke: #1e293b; }
    @media (prefers-color-scheme: light) {
      .bg-plate { fill: #0f172a; }
      .border-stroke { stroke: #334155; }
    }
  </style>

  <!-- Rounded Background Container for Instant Visibility on Any Tab Bar Theme -->
  <rect class="bg-plate border-stroke" x="2" y="2" width="60" height="60" rx="14" stroke-width="1.5" />

  <!-- Outer Hexagonal Molecular Shield -->
  <polygon points="32,8 52,19.5 52,42.5 32,54 12,42.5 12,19.5" 
           fill="none" 
           stroke="url(#hexGrad)" 
           stroke-width="2.5" 
           stroke-linejoin="round"
           opacity="0.9" />

  <!-- Inner Neural Interconnect Lattice Lines -->
  <line x1="32" y1="18" x2="20" y2="38" stroke="#38bdf8" stroke-width="1.8" opacity="0.85" stroke-linecap="round" />
  <line x1="32" y1="18" x2="44" y2="38" stroke="#38bdf8" stroke-width="1.8" opacity="0.85" stroke-linecap="round" />
  <line x1="20" y1="38" x2="44" y2="38" stroke="#818cf8" stroke-width="1.8" opacity="0.85" stroke-linecap="round" />
  <line x1="32" y1="18" x2="32" y2="33" stroke="#34d399" stroke-width="1.8" opacity="0.9" stroke-linecap="round" />
  <line x1="20" y1="38" x2="32" y2="33" stroke="#34d399" stroke-width="1.8" opacity="0.9" stroke-linecap="round" />
  <line x1="44" y1="38" x2="32" y2="33" stroke="#34d399" stroke-width="1.8" opacity="0.9" stroke-linecap="round" />

  <!-- Central Intelligence Pulse Node (Emerald Uptime / FinOps) -->
  <circle cx="32" cy="33" r="4" fill="url(#pulseGrad)" filter="url(#glow)" />
  <circle cx="32" cy="33" r="1.5" fill="#ffffff" />

  <!-- Neural Compute Vertex Nodes -->
  <circle cx="32" cy="18" r="3.2" fill="url(#nodeGrad)" />
  <circle cx="20" cy="38" r="3.2" fill="url(#hexGrad)" />
  <circle cx="44" cy="38" r="3.2" fill="url(#hexGrad)" />

  <!-- Subtle Core Hexagon Vertex Accents -->
  <circle cx="32" cy="8" r="1.2" fill="#38bdf8" opacity="0.9" />
  <circle cx="52" cy="19.5" r="1.2" fill="#38bdf8" opacity="0.9" />
  <circle cx="52" cy="42.5" r="1.2" fill="#818cf8" opacity="0.9" />
  <circle cx="32" cy="54" r="1.2" fill="#818cf8" opacity="0.9" />
  <circle cx="12" cy="42.5" r="1.2" fill="#38bdf8" opacity="0.9" />
  <circle cx="12" cy="19.5" r="1.2" fill="#38bdf8" opacity="0.9" />
</svg>