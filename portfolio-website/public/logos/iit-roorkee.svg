  <text x="48" y="36" fill="#D97706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.6">INDIAN INSTITUTE OF TECHNOLOGY</text>
