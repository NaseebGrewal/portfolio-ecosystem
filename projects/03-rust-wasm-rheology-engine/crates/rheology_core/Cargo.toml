[package]
name = "rheology_core"
version = "0.1.0"
edition = "2021"
authors = ["Senior AI Solutions Architect & Lead Systems Engineer"]
description = "High-Performance ISO 527 Tensile Invariant & Rheological Constitutive Solver in Rust & WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
